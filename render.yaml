services:
  - type: web
    name: focusly-student
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: focusly-db
          property: connectionString
databases:
  - name: focusly-db
    plan: basic-256mb
